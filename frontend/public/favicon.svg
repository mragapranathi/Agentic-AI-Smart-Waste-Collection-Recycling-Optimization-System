<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background Rounded Hexagon / Shield -->
  <rect width="64" height="64" rx="16" fill="#0B132B"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#10B981" stroke-width="2" stroke-opacity="0.3"/>
  
  <!-- Subtle Gradient Defs -->
  <defs>
    <linearGradient id="ecoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Smart Waste Recycle Loop -->
  <!-- Top Loop -->
  <path d="M32 12C39 12 45 16 48 22L44 24C41.5 19 37 16 32 16C27 16 22.5 19 20 24L24 25L15 28L13 18L17 19.5C20.5 15 26 12 32 12Z" fill="url(#ecoGrad)"/>
  
  <!-- Bottom Right Loop -->
  <path d="M52 32C52 38 49 43.5 44 47L42 43.5C45.5 40.5 48 36.5 48 32C48 28.5 46.5 25.5 44 23L47 20C50 23.5 52 27.5 52 32Z" fill="url(#ecoGrad)"/>
  
  <!-- Bottom Left Loop -->
  <path d="M32 52C25 52 19 48 16 42L20 40C22.5 45 27 48 32 48C37 48 41.5 45 44 40L40 39L49 36L51 46L47 44.5C43.5 49 38 52 32 52Z" fill="url(#ecoGrad)"/>

  <!-- AI Smart Bin / Central Neural Node -->
  <!-- Smart Sensor Bin Silhouette -->
  <rect x="25" y="27" width="14" height="15" rx="3" fill="#0F172A" stroke="url(#ecoGrad)" stroke-width="1.8"/>
  <path d="M23 25C23 24 25 23 27 23H37C39 23 41 24 41 25" stroke="url(#ecoGrad)" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Fill Level Indicator Waves -->
  <path d="M27 34C28.5 33 30 35 32 34C34 33 35.5 35 37 34" stroke="#34D399" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M27 38C28.5 37 30 39 32 38C34 37 35.5 39 37 38" stroke="#06B6D4" stroke-width="1.5" stroke-linecap="round"/>

  <!-- AI Pulse Beacon -->
  <circle cx="32" cy="20" r="2.5" fill="#34D399" filter="url(#glow)"/>
</svg>