services:
  - type: web
    name: smartwaste-backend
    runtime: python
    buildCommand: pip install -r requirements.txt && python scripts/seed_database.py
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        value: sqlite:////opt/render/project/src/smart_waste.db
      - key: GEMINI_API_KEY
        sync: false
    healthCheckPath: /api/health
    plan: free
    region: oregon
