version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: smart_waste_db
    environment:
      POSTGRES_USER: waste_user
      POSTGRES_PASSWORD: waste_password
      POSTGRES_DB: smart_waste_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waste_user -d smart_waste_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: smart_waste_backend
    environment:
      - DATABASE_URL=postgresql+psycopg2://waste_user:waste_password@postgres:5432/smart_waste_db
      - ENVIRONMENT=production
      - DEMO_MODE=true
      - LLM_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: smart_waste_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
